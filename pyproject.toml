[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "omp-generator"
version = "0.1.0"
description = "Generate the OpenMP support of OMP.jl (directives) and omp-abi (API routines) from the OpenMP specification sources"
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Romain PEREIRA", email = "rpereira@anl.gov" }]
requires-python = ">=3.9"
dependencies = []  # standard library only

[project.scripts]
omp-generator = "omp_generator.cli:main"

[tool.setuptools]
packages = ["omp_generator"]
